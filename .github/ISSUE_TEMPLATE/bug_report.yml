name: Bug report
description: Report a reproducible problem in the notebook
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not attach confidential or identifiable image data.

  - type: dropdown
    id: module
    attributes:
      label: Analysis module
      options:
        - Multiplex immunofluorescence
        - Chromogenic IHC
        - Both or uncertain
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: Notebook step
      placeholder: "For example, Step 4 or Step H3"
    validations:
      required: true

  - type: input
    id: input_format
    attributes:
      label: Input format and image dimensions
      placeholder: "For example, CZI, 2048 x 2048 pixels, 6 channels"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence of notebook choices that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Runtime and package versions
      description: Paste the version report printed by the setup cell and state the GPU type.
      render: shell
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed patient identifiers, credentials, and confidential data.
          required: true

